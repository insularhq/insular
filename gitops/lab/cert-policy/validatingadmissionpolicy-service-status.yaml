# Who writes a service's load-balancer status: only Cilium's operator should (audited first, ADR-0047)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: vdh-service-status}
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: [v1], operations: [UPDATE], resources: [services/status]}
  validations:
    - expression: "request.userInfo.username == 'system:serviceaccount:kube-system:cilium-operator'"
      message: "a service's status is written only by Cilium's operator (ADR-0172)"
