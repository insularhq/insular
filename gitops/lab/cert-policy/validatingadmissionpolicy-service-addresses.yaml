# Service addresses come only from the site's pools (ADR-0172 point 1): no externalIPs, no load-balancer class other
# than Cilium's; status writes are audited until a ring shows who writes them (progressive enforcement, ADR-0047)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: vdh-service-addresses}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [services]}
  validations:
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "externalIPs are refused: a service's addresses come only from the site's pools (ADR-0172)"
    - expression: "!has(object.spec.loadBalancerClass) || object.spec.loadBalancerClass in ['io.cilium/bgp-control-plane', 'io.cilium/l2-announcer']"
      message: "only Cilium's load-balancer classes are allowed (ADR-0172)"
