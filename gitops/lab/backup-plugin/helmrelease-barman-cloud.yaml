apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
# CloudNativePG's Barman Cloud plugin (CNPG-I): WAL archiving and base backups to S3-compatible object storage, the
# successor of the in-tree barmanObjectStore. Needs cert-manager for its webhook (ADR-0113, roadmap).
metadata: {name: barman-cloud, namespace: cnpg-system, annotations: {vdh.component: "Barman Cloud plugin", vdh.app-version: "v0.15.1"}}
spec:
  interval: 30m
  timeout: 10m
  dependsOn:
    - {name: cnpg}
    - {name: cert-manager, namespace: cert-manager}
  chartRef: {kind: OCIRepository, name: chart-plugin-barman-cloud, namespace: flux-system}   # chart plugin-barman-cloud 0.8.1, locked and signed
  # a transient failure (a hook Job on a loaded node) is retried, never left Stalled for a person
  install: {crds: CreateReplace, remediation: {retries: 3}}
  upgrade: {crds: CreateReplace, remediation: {retries: 3}}
  postRenderers:   # the chart's images pinned by digest
    - kustomize:
        images:
          - {name: ghcr.io/cloudnative-pg/plugin-barman-cloud, digest: "sha256:c75acad19a36e8176cfe2885761ff1b836c6ef977d7257e298c99a28b5c302ef"}
        # The plugin injects its sidecar into every Postgres pod from SIDECAR_IMAGE, which the chart sets by tag (red
        # team found by the widened lab digest check): pinned here to the digest of v0.15.1.
        patches:
          - target: {kind: Deployment, name: barman-cloud-plugin-barman-cloud}
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata: {name: barman-cloud-plugin-barman-cloud}
              spec:
                template:
                  spec:
                    containers:
                      - name: barman-cloud
                        env:
                          - name: SIDECAR_IMAGE
                            value: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar@sha256:2287a793a804db751edd0d07d44cd549e357677e98a800eb12e2cf7c0d53f9b0
                            valueFrom: null
