# The ring's gateway collector (ADR-0081, ADR-0152): OTLP in from the node agents, a persistent queue on disk (a
# ClickHouse outage or restart loses nothing the queue can hold), events into ClickHouse (otel.otel_logs, 7 days).
extensions:
  file_storage/queue: {directory: /var/lib/otelcol/queue, create_directory: true}
  health_check: {endpoint: "[::]:13133"}
receivers:
  otlp:
    protocols: {grpc: {endpoint: "[::]:4317"}}
  # the forge's events (ADR-0154): Forgejo's webhook (push, pull request, review, issue, release) as log records;
  # only the forge's namespace reaches this port (networkpolicy.yaml) and only with the event store's token
  webhook_event/forge:
    endpoint: "[::]:8088"
    path: /events/forge
    health_path: /events/forge/health
    header_attribute_regex: "X-Forgejo-(Event|Delivery|Event-Type)"
    required_header: {key: Authorization, value: "Bearer ${env:FORGE_HOOK_TOKEN}"}   # only the system hook holds it
  # the cluster's events: a pod crash-looping or never ready shows here first (read-only on events)
  k8s_objects:
    auth_type: serviceAccount
    objects: [{name: events, mode: watch, group: events.k8s.io}]
processors:
  resource/k8s: {attributes: [{key: service.name, value: kubernetes, action: upsert}, {key: vdh.source, value: k8s-events, action: upsert}]}
  attributes/k8s: {actions: [{key: event.domain, value: k8s.event, action: upsert}]}
  resource/forge: {attributes: [{key: service.name, value: forgejo, action: upsert}, {key: vdh.source, value: forge, action: upsert}]}
  batch: {send_batch_size: 2000, timeout: 5s}
  memory_limiter: {check_interval: 2s, limit_percentage: 80, spike_limit_percentage: 20}
exporters:
  clickhouse:
    endpoint: tcp://clickhouse.vdh-telemetry.svc:9000?dial_timeout=10s
    database: otel
    username: otel
    password: ${env:CH_PASSWORD}
    create_schema: true
    logs_table_name: otel_logs
    ttl: 168h
    timeout: 10s
    retry_on_failure: {enabled: true, initial_interval: 5s, max_interval: 30s, max_elapsed_time: 0s}
    sending_queue: {enabled: true, storage: file_storage/queue, queue_size: 20000}
service:
  extensions: [file_storage/queue, health_check]
  telemetry:
    logs: {level: warn}
    metrics: {readers: [{pull: {exporter: {prometheus: {host: "::", port: 8888}}}}]}
  pipelines:
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [clickhouse]}
    logs/forge: {receivers: [webhook_event/forge], processors: [memory_limiter, resource/forge, batch], exporters: [clickhouse]}
    logs/k8s: {receivers: [k8s_objects], processors: [memory_limiter, resource/k8s, attributes/k8s, batch], exporters: [clickhouse]}
