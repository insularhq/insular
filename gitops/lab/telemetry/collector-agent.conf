# A node agent (ADR-0081 profile network and gateway): every node's Hubble flow export, the Harbor's decision log and
# the gateways' access logs, as OTLP logs to the ring's gateway collector. Bodies stay as written (JSON); ClickHouse
# reads their fields. Each record says what it is (event.domain) and where it came from (node).
receivers:
  filelog/hubble:
    include: [/var/run/cilium/hubble/events.log]
    start_at: end
    include_file_path: false
    operators:
      - type: add
        field: 'attributes["event.domain"]'
        value: network.flow
  filelog/pods:
    include:
      - /var/log/pods/vdh-harbor_harbor-pdp-*/*/*.log
      - /var/log/pods/envoy-gateway-system_envoy-*/envoy/*.log
      - /var/log/pods/vdh-front_*/*/*.log
    start_at: end
    include_file_path: true
    operators:
      - type: container
        add_metadata_from_filepath: true
      - type: router
        routes:
          - expr: 'attributes["log.file.path"] matches "harbor-pdp"'
            output: decision
        default: access
      - id: decision
        type: add
        field: 'attributes["event.domain"]'
        value: harbor.decision
        output: done
      - id: access
        type: add
        field: 'attributes["event.domain"]'
        value: gateway.access
        output: done
      - id: done
        type: noop
processors:
  resource:
    attributes:
      - {key: k8s.node.name, value: "${env:NODE_NAME}", action: upsert}
  batch: {send_batch_size: 500, timeout: 5s}
  memory_limiter: {check_interval: 2s, limit_mib: 200}
exporters:
  otlp:
    endpoint: collector-gateway.vdh-telemetry.svc:4317
    tls: {insecure: true}   # in-cluster, Cilium WireGuard between nodes; mTLS with SPIFFE ids is the next step
    sending_queue: {enabled: true, queue_size: 5000}
service:
  telemetry: {logs: {level: warn}}
  pipelines:
    logs: {receivers: [filelog/hubble, filelog/pods], processors: [memory_limiter, resource, batch], exporters: [otlp]}
