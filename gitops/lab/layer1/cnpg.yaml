apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: cnpg, namespace: cnpg-system, annotations: {vdh.component: "CloudNativePG", vdh.app-version: "v1.30.1"}}
spec:
  interval: 30m
  timeout: 10m
  chartRef: {kind: OCIRepository, name: chart-cloudnative-pg, namespace: flux-system}   # chart cloudnative-pg 0.29.1, locked and signed
  # a transient failure (a hook Job on a loaded node) is retried, never left Stalled for a person
  install: {crds: CreateReplace, remediation: {retries: 3}}
  upgrade: {crds: CreateReplace, remediation: {retries: 3}}
  postRenderers:   # the chart's images pinned by digest
    - kustomize:
        images:
          - {name: ghcr.io/cloudnative-pg/cloudnative-pg, digest: "sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07"}
