# created in layer 1, before any child Kustomization, so segmentation's policies and the
# workloads always find their namespace; never pruned, so moving it here cannot delete it on a running ring.
# ADR-0122 and ADR-0134: NetBird the login network: devices' machine peers and the login entry in front of Keycloak, nothing else. Server config with its keys is a Secret made inside the ring
# (by the lab tooling); TLS from the ring CA (ClusterIssuer ring-ca); trust for Keycloak's TLS through the
# same CA bundle as OpenCloud.
apiVersion: v1
kind: Namespace
metadata: {name: vdh-nblogin, annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}, labels: {vdh.component: netbird, vdh.network: login}}
