apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: cert-manager, namespace: cert-manager, annotations: {vdh.component: "cert-manager", vdh.app-version: "v1.21.2"}}
spec:
  interval: 30m
  timeout: 10m
  chartRef: {kind: OCIRepository, name: chart-cert-manager, namespace: flux-system}   # chart cert-manager v1.21.2, locked and signed
  # a transient failure (a hook Job on a loaded node) is retried, never left Stalled for a person
  install: {crds: CreateReplace, remediation: {retries: 3}}
  upgrade: {crds: CreateReplace, remediation: {retries: 3}}
  values:
    crds: {enabled: true}
    replicaCount: 2
    podDisruptionBudget: {enabled: true}
    disableAutoApproval: true   # ADR-0172: approval only by a request policy (approver-policy)
  postRenderers:   # the chart's images pinned by digest
    - kustomize:
        images:
          - {name: quay.io/jetstack/cert-manager-controller, digest: "sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8"}
          - {name: quay.io/jetstack/cert-manager-cainjector, digest: "sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562"}
          - {name: quay.io/jetstack/cert-manager-webhook, digest: "sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae"}
