apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: harbor-identity, namespace: vdh-harbor}
spec:
  parentRefs: [{name: harbor-gw, sectionName: id}]
  hostnames: ["id.${ring_domain:=lab.vdh.test}"]
  rules:
    # the vdh realm only: never the master realm or the admin console
    - matches: [{path: {type: PathPrefix, value: /realms/vdh/}}, {path: {type: PathPrefix, value: /resources/}}]
      backendRefs: [{name: keycloak, namespace: vdh-identity, port: 8080}]
