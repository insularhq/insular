# Chart lock (ADR-0126): every Helm chart the lab installs, at a pinned version and the sha256 of its
# chart archive, recorded from the upstream index (or the OCI layer digest). The layer script fetches
# each chart once, refuses it unless the sha256 matches, pushes it to the in-site mirror and signs it with the lab's
# cosign key; Flux installs charts only from the mirror and only when that signature verifies. This file is not a
# Kubernetes resource and is not listed in any kustomization.
charts:
