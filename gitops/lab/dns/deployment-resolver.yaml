# The Isle's validating resolver (ADR-0172 amendment): Knot Resolver 6.4.2 (GPL-3.0-or-later, CZ.NIC); the
# tenant's names from the Isle's Knot, validated against the apex's key; serve-stale at its built-in day; its cache in
# memory; unprivileged (nobody: its permission check needs a named user) on 5353 behind its fixed service address; its
# NSID is the pod's name
apiVersion: apps/v1
kind: Deployment
metadata: {name: resolver, namespace: vdh-dns, annotations: {vdh.component: "Knot DNS", vdh.part: "Knot Resolver", vdh.app-version: "6.4.2"}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: resolver}}
  template:
    metadata: {labels: {app: resolver}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: anchor
          image: docker.io/cznic/knot:v3.6.0@sha256:166fd8956f1a69eeb6558c28f65cedb4ea112d4689317f4a50c2f2787ee6a622
          command: ["/bin/bash", "/code/anchor.sh", "vdhome.internal", "fd00:0:0:180::35"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts:
            - {name: code, mountPath: /code, readOnly: true}
            - {name: template, mountPath: /template, readOnly: true}
            - {name: parent, mountPath: /parent, readOnly: true}   # a federation parent, when one is set
            - {name: etc, mountPath: /etc-out}
      containers:
        - name: resolver
          image: docker.io/cznic/knot-resolver:v6.4.2-20260926@sha256:8a5b87ed1842c28a957b99693dcd6cc11a04c0f9ce07fc54736357c3fbc32b2e
          args: ["-c", "/etc/knot-resolver/config.yaml"]
          ports: [{name: dns-udp, containerPort: 5353, protocol: UDP}, {name: dns-tcp, containerPort: 5353, protocol: TCP}]
          readinessProbe: {tcpSocket: {port: 5353}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 20m, memory: 96Mi}, limits: {memory: 256Mi}}
          volumeMounts:
            - {name: etc, mountPath: /etc/knot-resolver}
            - {name: run, mountPath: /run/knot-resolver}
            - {name: cache, mountPath: /var/cache/knot-resolver}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: code, configMap: {name: dns-code}}
        - {name: template, configMap: {name: dns-config, items: [{key: resolver.yaml, path: resolver.yaml}]}}
        - {name: parent, configMap: {name: dns-federation-parent, optional: true}}   # written by the organisation's operation, never git
        - {name: etc, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: cache, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
        - {name: tmp, emptyDir: {}}
