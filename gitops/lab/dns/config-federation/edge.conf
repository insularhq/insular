# generated by tools/dns_zones.py from platform/addressing.yaml; do not edit
# The public secondary: on the edge node's host network, bound to its public addresses
# only, serving the federation zone and nothing else; who may ask is the node's admitted set (the Harbor's
# partners and the parent), never the world
server:
    rundir: /rundir
    listen: ["${ring_public_v6:=2001:db8::1}@53", "${ring_public_v4:=192.0.2.1}@53"]
    identity: ""
    version: ""
    nsid: ""
database:
    storage: /storage
log:
  - target: stdout
    any: info
include: /keys/edge.conf
remote:
  - id: signer
    address: fd00:0:0:180::35@53
    key: edge
template:
  - id: default
    storage: /storage
    zonefile-sync: -1
    journal-content: changes
zone:
  - domain: ${ring_domain:=lab.vdh.test}
    master: signer
    zonemd-verify: on
