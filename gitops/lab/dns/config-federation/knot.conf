# generated by tools/dns_zones.py from platform/addressing.yaml; do not edit
# substituted by Flux (ring-settings): the federation zone, transferred only to the edge
# secondary's key, never to an address
acl:
  - id: edge-transfer
    key: edge
    action: transfer
policy:
  - id: federation
    algorithm: ecdsap256sha256
    nsec3: off
    ksk-lifetime: 0
    zsk-lifetime: 30d
    rrsig-lifetime: 9d
    rrsig-refresh: 1d
    dnskey-ttl: 300
    zone-max-ttl: 300
zone:
  - domain: ${ring_domain:=lab.vdh.test}
    file: /federation/federation.zone
    dnssec-policy: federation
    acl: edge-transfer
    zonemd-generate: zonemd-sha384
