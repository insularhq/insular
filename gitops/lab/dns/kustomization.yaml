apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The Isle's DNS (ADR-0172 and its amendment): Knot DNS signs the tenant's apex (a stand-in for the
# Chartroom's) and the Isle's zone from git; Knot Resolver validates against the apex's key and asks the Isle's Knot for
# every tenant name, so a cut keeps them. Zones, configuration and service addresses are generated by
# tools/dns_zones.py from the address plan.
resources:
  - networkpolicy-default-deny-ingress.yaml
  - cnp-egress-floor.yaml
  - cnp-resolver-to-world.yaml
  - pvc-knot.yaml
  - deployment-knot.yaml
  - service-knot.yaml
  - deployment-resolver.yaml
  - service-resolver.yaml
  - cnp-edge-to-signer.yaml
  - daemonset-knot-edge.yaml
configMapGenerator:
  # the federation zone under the ring's domain and its public secondary; generated by
  # tools/dns_zones.py with the ring's values as Flux variables (ring-settings), so this one is substituted
  - name: dns-federation
    namespace: vdh-dns
    files: [config-federation/knot.conf, config-federation/federation.zone, config-federation/edge.conf]
  - name: dns-config
    namespace: vdh-dns
    options: {annotations: {kustomize.toolkit.fluxcd.io/substitute: disabled}}   # generated: never substituted
    files: [config/knot.conf, config/resolver.yaml, config/vdhome.internal.zone, config/isle.vdhome.internal.zone]
  - name: dns-code
    namespace: vdh-dns
    options: {annotations: {kustomize.toolkit.fluxcd.io/substitute: disabled}}   # code: never substituted
    files: [child-ds.sh, anchor.sh]
