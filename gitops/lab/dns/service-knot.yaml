# the Isle's authoritative signer on its fixed address from the address plan (generated by tools/dns_zones.py from platform/addressing.yaml; do not edit)
apiVersion: v1
kind: Service
metadata: {name: knot, namespace: vdh-dns}
spec:
  clusterIP: fd00:0:0:180::35
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector: {app: knot}
  ports:
    - {name: dns-udp, port: 53, targetPort: 5353, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: 5353, protocol: TCP}
