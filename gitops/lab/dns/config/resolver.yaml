# generated by tools/dns_zones.py from platform/addressing.yaml; do not edit
# The tenant's names go to the Isle's Knot and are validated against the apex's key (written by the init
# container); serve-stale keeps its built-in one day for outside names (ADR-0172 amendment).
rundir: /run/knot-resolver
workers: 1
nsid: __NSID__
network:
  listen:
    - interface: '::@5353'
management:
  unix-socket: /run/knot-resolver/kres-api.sock
cache:
  storage: /var/cache/knot-resolver
  size-max: 48M
options:
  serve-stale: true
logging:
  level: notice
  target: stdout
dnssec:
  trust-anchors-files:
    - file: /etc/knot-resolver/apex.key
      read-only: true
# __PARENT_ANCHOR__
forward:
  - subtree: vdhome.internal
    servers: ['fd00:0:0:180::35']
    options: {authoritative: true, dnssec: true}
# __PARENT_FORWARD__
