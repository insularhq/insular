# generated by tools/dns_zones.py from platform/addressing.yaml; do not edit
# The apex stands in for the Chartroom's (its KSK online on the lab); the Isle's zone is its signed child.
server:
    rundir: /rundir
    listen: ["::@5353"]
database:
    storage: /storage
log:
  - target: stdout
    any: info
policy:
  - id: apex
    algorithm: ecdsap256sha256
    nsec3: off
    ksk-lifetime: 0
    zsk-lifetime: 30d
    rrsig-lifetime: 9d
    rrsig-refresh: 1d
    dnskey-ttl: 3600
    zone-max-ttl: 3600
  - id: isle
    algorithm: ecdsap256sha256
    nsec3: off
    ksk-lifetime: 0
    zsk-lifetime: 30d
    rrsig-lifetime: 9d
    rrsig-refresh: 1d
    dnskey-ttl: 3600
    zone-max-ttl: 3600
template:
  - id: default
    storage: /config
    file: "%s.zone"
    zonefile-sync: -1
    zonefile-load: difference-no-serial
    journal-content: all
    semantic-checks: on
    serial-policy: unixtime
    dnssec-signing: on
zone:
  - domain: vdhome.internal
    dnssec-policy: apex
  - domain: isle.vdhome.internal
    dnssec-policy: isle
# the federation zone under the ring's domain: ring values substituted by Flux, so it lives in
# its own file; the edge secondary's TSIG key is a ring secret
include: /keys/edge.conf
include: /federation/knot.conf
