apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: edge-demo, namespace: flux-system}
spec:
  interval: 10m
  dependsOn: [{name: segmentation}, {name: pdp}]
  sourceRef: {kind: OCIRepository, name: lab-gitops}
  path: ./edge-demo
  prune: true
  wait: true
  timeout: 10m
