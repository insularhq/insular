# ADR-0109: the proxies listen on IPv6 (an IPv6-only cluster) and sit behind a ClusterIP service (no load balancer
# on the lab; the IEG fronts the site in production)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata: {name: vdh-proxy, namespace: envoy-gateway-system}
spec:
  ipFamily: IPv6
  # sign-in first, then the decision: the PDP needs the token the OIDC filter obtains (Pharos)
  filterOrder: [{name: envoy.filters.http.ext_authz, after: envoy.filters.http.oauth2}]
  provider:
    type: Kubernetes
    kubernetes:
      envoyService: {type: ClusterIP}
      envoyDeployment:   # the data-plane image pinned by digest
        container: {image: "docker.io/envoyproxy/envoy@sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4"}
