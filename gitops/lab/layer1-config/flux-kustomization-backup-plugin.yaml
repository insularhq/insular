# CloudNativePG's Barman Cloud plugin: after cert-policy, which holds the policy for its certificates;
# the database units wait for it (identity, forge, netbox, tenant-demo)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: backup-plugin, namespace: flux-system}
spec:
  interval: 10m
  dependsOn: [{name: cert-policy}]
  sourceRef: {kind: OCIRepository, name: lab-gitops}
  path: ./backup-plugin
  prune: true
  wait: true
  timeout: 15m
