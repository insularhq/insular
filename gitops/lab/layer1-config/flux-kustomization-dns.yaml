# The Isle's DNS (ADR-0172): after the ring's segmentation
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: dns, namespace: flux-system}
spec:
  interval: 10m
  dependsOn: [{name: segmentation}]
  sourceRef: {kind: OCIRepository, name: lab-gitops}
  path: ./dns
  prune: true
  wait: false
  timeout: 10m
  postBuild:   # the federation zone and the edge's listen addresses are the ring's own
    substituteFrom: [{kind: ConfigMap, name: ring-settings, optional: true}]
