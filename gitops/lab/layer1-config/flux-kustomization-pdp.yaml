apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: pdp, namespace: flux-system}
spec:
  interval: 10m
  dependsOn: [{name: segmentation}]   # no workload before its policy
  sourceRef: {kind: OCIRepository, name: lab-gitops}
  path: ./pdp
  prune: true
  wait: true
  timeout: 10m
  postBuild:   # the ring's own domain; without the ConfigMap the lab default applies
    substituteFrom: [{kind: ConfigMap, name: ring-settings, optional: true}]
