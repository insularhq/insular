# The forge (ADR-0154): Forgejo on each ring, signed in through the ring's Keycloak
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: forge, namespace: flux-system}
spec:
  interval: 10m
  dependsOn: [{name: segmentation}, {name: identity}, {name: backup-plugin}]
  sourceRef: {kind: OCIRepository, name: lab-gitops}
  path: ./forge
  prune: true
  wait: false
  timeout: 10m
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: ring-settings, optional: true}]
