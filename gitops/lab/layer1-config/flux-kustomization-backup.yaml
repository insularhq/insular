apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: backup, namespace: flux-system}
spec:
  interval: 10m
  dependsOn: [{name: segmentation}]   # no workload before its policy
  sourceRef: {kind: OCIRepository, name: lab-gitops}
  path: ./backup
  prune: true
  wait: false     # Garage waits for its RPC secret, which the drill script creates on the lab
  timeout: 10m
