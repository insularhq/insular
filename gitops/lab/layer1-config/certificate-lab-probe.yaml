apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: lab-probe, namespace: vdh-test}
spec:
  secretName: lab-probe-tls
  duration: 24h            # ADR-0093: a certificate is a lease
  renewBefore: 5h
  dnsNames: [probe.vdh-test.svc.cluster.local]
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef: {name: lab-selfsigned, kind: ClusterIssuer}
