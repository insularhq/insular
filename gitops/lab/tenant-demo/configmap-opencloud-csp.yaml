# ADR-0137: OpenCloud's Content Security Policy for a restricted ring, replacing OpenCloud's default
# (PROXY_CSP_CONFIG_FILE_OVERRIDE_LOCATION replaces it whole). The default allowed the browser to reach GitHub (the
# app list), update.opencloud.eu (an update check) and embed.diagrams.net, and not the ring's IdP, so the web app
# could not fetch Keycloak's discovery and stayed blank. Here: the app itself, and the IdP for discovery,
# token calls and the silent-renew frame; nothing outside the ring.
apiVersion: v1
kind: ConfigMap
metadata: {name: opencloud-csp, namespace: vdh-tenant-demo}
data:
  csp.yaml: |
    directives:
      child-src:
        - '''self'''
      connect-src:
        - '''self'''
        - 'blob:'
        - 'https://id.${ring_domain:=lab.vdh.test}/'
      default-src:
        - '''none'''
      font-src:
        - '''self'''
      frame-ancestors:
        - '''self'''
      frame-src:
        - '''self'''
        - 'blob:'
        - 'https://id.${ring_domain:=lab.vdh.test}/'
      img-src:
        - '''self'''
        - 'data:'
        - 'blob:'
      manifest-src:
        - '''self'''
      media-src:
        - '''self'''
      object-src:
        - '''self'''
        - 'blob:'
      script-src:
        - '''self'''
        - '''unsafe-inline'''
      style-src:
        - '''self'''
        - '''unsafe-inline'''
