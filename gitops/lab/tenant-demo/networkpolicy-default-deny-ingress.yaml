apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: vdh-tenant-demo}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}}}]
      ports: [{port: 9200, protocol: TCP}, {port: 8008, protocol: TCP}, {port: 8080, protocol: TCP}]   # OpenCloud, Synapse, Element
    - from: [{podSelector: {}}]   # inside the tenant: Synapse to its database
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}}]
      ports: [{port: 8000, protocol: TCP}, {port: 5432, protocol: TCP}]   # the database operator to its instance
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: vdh-pharos}}, podSelector: {matchLabels: {app: prometheus}}}]
      ports: [{port: 9205, protocol: TCP}, {port: 9000, protocol: TCP}, {port: 9187, protocol: TCP}]   # OpenCloud, Synapse, its database's exporter
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: vdh-pharos}}, podSelector: {matchLabels: {app: room-sender}}}]
      ports: [{port: 8008, protocol: TCP}]   # the alert room sender to the homeserver's client API
