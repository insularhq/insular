apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: element, namespace: vdh-tenant-demo}
spec:
  parentRefs: [{name: pharos-gw, namespace: vdh-pharos}]
  hostnames: ["chat.${ring_domain:=lab.vdh.test}"]
  rules:
    # Element may be framed by the pane's chat shell only: its image sends frame-ancestors 'self' and
    # X-Frame-Options SAMEORIGIN, which the gateway replaces with the one exact ancestor
    - backendRefs: [{name: element, port: 8080}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set: [{name: Content-Security-Policy, value: "frame-ancestors https://pharos.${ring_domain:=lab.vdh.test}"}]
            remove: [X-Frame-Options]
