# The tenant's Matrix homeserver database (ADR-0114): CloudNativePG, one instance, C collation as Synapse requires.
# The app secret synapse-db-app is made by the operator and never leaves the namespace.
# Backups: objectstore-ring-store.yaml and scheduledbackup-synapse-db.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: synapse-db, namespace: vdh-tenant-demo}
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:3e89ea90485ffda67094fd6950d9d61dec9ec314aabc8d63c048c67759918621"
  storage: {size: 2Gi}
  bootstrap: {initdb: {database: synapse, owner: synapse, encoding: UTF8, localeCollate: C, localeCType: C}}
  affinity: {enablePodAntiAffinity: true, topologyKey: kubernetes.io/hostname, podAntiAffinityType: required}
  plugins:   # WAL and base backups to the ring's Garage, then off the Isle
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: {barmanObjectName: ring-store, serverName: synapse-db}   # the convention the size-S overlay patches
