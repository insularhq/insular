# ADR-0122 and ADR-0134: NetBird the login network: devices' machine peers and the login entry in front of Keycloak, nothing else. Server config with its keys is a Secret made inside the ring
# (by the lab tooling); TLS from the ring CA (ClusterIssuer ring-ca); trust for Keycloak's TLS through the
# same CA bundle as OpenCloud.
apiVersion: v1
kind: Service
metadata: {name: netbird, namespace: vdh-nblogin}
spec:
  ipFamilies: [IPv6]
  selector: {app: netbird}
  ports: [{name: https, port: 443}, {name: stun, port: 3478, protocol: UDP}]
