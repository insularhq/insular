# ADR-0122 and ADR-0134: NetBird the main network: people's devices as user peers signed in through Keycloak, and the app entry. Server config with its keys is a Secret made inside the ring
# (by the lab tooling); TLS from the ring CA (ClusterIssuer ring-ca); trust for Keycloak's TLS through the
# same CA bundle as OpenCloud.
apiVersion: v1
kind: ConfigMap
metadata: {name: app-entry-envoy, namespace: vdh-nbmain}
data:
  envoy.yaml: |
    # the app entry: the main network's only way to the apps (OpenCloud, Pharos) behind the lab gateway: a plain TCP proxy, TLS ends at the gateway with the ring CA
    static_resources:
      listeners:
        - name: entry
          address: {socket_address: {address: 0.0.0.0, port_value: 443}}
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy, stat_prefix: entry, cluster: gateway}
      clusters:
        - name: gateway
          type: STRICT_DNS
          dns_lookup_family: V6_ONLY
          connect_timeout: 5s
          load_assignment: {cluster_name: gateway, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: lab-edge.envoy-gateway-system.svc.cluster.local, port_value: 443}}}}]}]}
    overload_manager:
      resource_monitors:
        - name: envoy.resource_monitors.global_downstream_max_connections
          typed_config: {"@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig, max_active_downstream_connections: 2048}
