# the KeyClerk desk for people (requests, approvals by passkey) on the pane's gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: access, namespace: vdh-identity}
spec:
  parentRefs: [{name: pharos-gw, namespace: vdh-pharos}]
  hostnames: ["access.${ring_domain:=lab.vdh.test}"]
  rules:
    - backendRefs: [{name: keyclerk, port: 8091}]
