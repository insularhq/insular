apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: id, namespace: vdh-identity}
spec:
  parentRefs: [{name: pharos-gw, namespace: vdh-pharos}]
  hostnames: ["id.${ring_domain:=lab.vdh.test}"]
  # only the vdh realm and the static resources it needs are routed; the master realm and the admin console
  # answer on no route (administration is the realm service account, in the cluster)
  rules:
    - matches: [{path: {type: PathPrefix, value: /realms/vdh/}}, {path: {type: PathPrefix, value: /resources/}}]
      backendRefs: [{name: keycloak, port: 8080}]
