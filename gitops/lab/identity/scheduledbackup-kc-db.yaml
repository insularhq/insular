# A base backup of kc-db every six hours and one at once when it is created; WAL archives in between.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: {name: kc-db, namespace: vdh-identity}
spec:
  schedule: "0 0 */6 * * *"
  immediate: true
  backupOwnerReference: self
  cluster: {name: kc-db}
  method: plugin
  pluginConfiguration: {name: barman-cloud.cloudnative-pg.io}
