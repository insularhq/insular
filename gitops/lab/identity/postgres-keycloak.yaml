# Keycloak's own database (CloudNativePG, two instances on different nodes); the app secret kc-db-app is made by the
# operator and never leaves the cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: kc-db, namespace: vdh-identity}
spec:
  instances: 2
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:3e89ea90485ffda67094fd6950d9d61dec9ec314aabc8d63c048c67759918621"
  storage: {size: 1Gi}
  bootstrap: {initdb: {database: keycloak, owner: keycloak}}
  affinity: {enablePodAntiAffinity: true, topologyKey: kubernetes.io/hostname, podAntiAffinityType: required}
  plugins:   # WAL and base backups to the ring's Garage, then off the Isle
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: {barmanObjectName: ring-store, serverName: kc-db}
