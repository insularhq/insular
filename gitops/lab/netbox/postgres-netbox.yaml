apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: netbox-db, namespace: vdh-netbox}
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:3e89ea90485ffda67094fd6950d9d61dec9ec314aabc8d63c048c67759918621"
  storage: {size: 2Gi}
  bootstrap: {initdb: {database: netbox, owner: netbox}}
  affinity: {enablePodAntiAffinity: true, topologyKey: kubernetes.io/hostname, podAntiAffinityType: required}
  plugins:   # WAL and base backups to the ring's Garage (bucket pg-netbox), then off the Isle
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: {barmanObjectName: ring-store, serverName: netbox-db}
