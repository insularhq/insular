apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: netbox-bootstrap, namespace: vdh-netbox}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [create]}
  - {apiGroups: [""], resources: [secrets], resourceNames: [netbox-token-pipeline-dcim, netbox-token-ipam-drift], verbs: [get, update]}
