# NetBox 4.7.2 (netbox-docker 5.1.1; pinned past the two-week age rule) as a plain Deployment, not the chart
# (the lab's own manifests): login required, no superuser, no Copilot, no census, isolated; migrations run in
# the image's entrypoint on start (a database backup precedes an image change, ADR-0171 point 7); the health check
# asks the login page as localhost (pod addresses are never allowed hosts).
apiVersion: apps/v1
kind: Deployment
metadata: {name: netbox, namespace: vdh-netbox, annotations: {vdh.component: "NetBox", vdh.app-version: "v4.7.2"}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: netbox}}
  template:
    metadata: {labels: {app: netbox}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 0, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: netbox
          image: docker.io/netboxcommunity/netbox:v4.7.2-5.1.1@sha256:3cf9d3bd77aa186233b84d0ea1cf1755581d5e5678fa7d86ec3be62f79d0c643
          env:
            - {name: DB_HOST, value: netbox-db-rw}
            - {name: DB_NAME, value: netbox}
            - {name: DB_USER, value: netbox}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: netbox-db-app, key: password}}}
            - {name: REDIS_HOST, value: valkey}
            - {name: REDIS_DATABASE, value: "0"}
            - {name: REDIS_CACHE_HOST, value: valkey}
            - {name: REDIS_CACHE_DATABASE, value: "1"}
            - {name: ALLOWED_HOSTS, value: "netbox.${ring_domain:=lab.vdh.test} netbox.vdh-netbox.svc.cluster.local netbox.vdh-netbox.svc"}
            - {name: CSRF_TRUSTED_ORIGINS, value: "https://netbox.${ring_domain:=lab.vdh.test}"}
            - {name: LOGIN_REQUIRED, value: "true"}
            - {name: SKIP_SUPERUSER, value: "true"}         # ADR-0171: no superuser, no standing token
            - {name: METRICS_ENABLED, value: "false"}       # health by a probe from the pane; no metrics endpoint
            - {name: COPILOT_ENABLED, value: "false"}       # NetBox Labs' agent (default on): never
            - {name: CENSUS_REPORTING_ENABLED, value: "false"}   # default on: no reporting home
            - {name: ISOLATED_DEPLOYMENT, value: "true"}    # no function that needs the internet
            - {name: GRANIAN_WORKERS, value: "2"}
            - {name: MEDIA_ROOT, value: /opt/netbox/netbox/media}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /login/, port: 8080, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 10, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /login/, port: 8080, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 15}
          livenessProbe: {httpGet: {path: /login/, port: 8080, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 30, timeoutSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 1Gi}}
          volumeMounts:
            - {name: keys, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: media, mountPath: /opt/netbox/netbox/media}
      volumes:
        - name: keys
          secret:
            secretName: netbox-keys
            items:
              - {key: secret_key, path: secret_key}
              - {key: api_token_pepper_1, path: api_token_pepper_1}
              - {key: valkey_password, path: redis_password}
              - {key: valkey_password, path: redis_cache_password}
        - {name: tmp, emptyDir: {}}
        - {name: media, emptyDir: {}}   # no uploads, reports or scripts on the lab (scripts off, ADR-0171)
