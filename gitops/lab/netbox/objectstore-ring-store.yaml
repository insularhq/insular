apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata: {name: ring-store, namespace: vdh-netbox}
spec:
  configuration:
    destinationPath: s3://pg-netbox/
    endpointURL: http://garage.vdh-backup.svc.cluster.local:3900
    s3Credentials:
      accessKeyId: {name: garage-s3, key: ACCESS_KEY_ID}
      secretAccessKey: {name: garage-s3, key: ACCESS_SECRET_KEY}
      region: {name: garage-s3, key: REGION}
    wal: {compression: gzip}
    data: {compression: gzip}
  retentionPolicy: "7d"
