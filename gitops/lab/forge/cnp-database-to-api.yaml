# The forge's PostgreSQL instances (CloudNativePG) talk to the Kubernetes API; nothing else of the forge does.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: database-to-api, namespace: vdh-forge}
spec:
  endpointSelector: {matchExpressions: [{key: cnpg.io/cluster, operator: Exists}]}
  egress:
    - toEntities: [kube-apiserver]
