# The forge is reached by the gateway's proxies (people, git over HTTPS), its own namespace (Forgejo to its database)
# and the CloudNativePG operator (instance manager and PostgreSQL).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: vdh-forge}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}}}]
      ports: [{port: 3000, protocol: TCP}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: vdh-pharos}}, podSelector: {matchLabels: {app: prometheus}}}]
      ports: [{port: 3000, protocol: TCP}, {port: 9187, protocol: TCP}]   # Forgejo, its database's exporter
    - from: [{podSelector: {}}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}}]
      ports: [{port: 8000, protocol: TCP}, {port: 5432, protocol: TCP}]
