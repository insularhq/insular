# Flux lock (ADR-0126): the Flux release the lab installs and the digest of every controller
# image, recorded on the lab and verified with cosign against Flux's own release signatures (keyless,
# certificate identity ^https://github.com/fluxcd/, issuer https://token.actions.githubusercontent.com). The layer
# script installs Flux from `flux install --export` with these digests and refuses a controller without one. This file
# is not a Kubernetes resource and is not listed in any kustomization.
