apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ingress segmentation for the namespaces the GitOps tree owns and the two system namespaces with webhooks; vdh-pharos, vdh-identity and vdh-demo-app carry their own
# default-deny policies. Allow rules come from the lab's measured east-west inventory.
resources:
  - cnp-vdh-pdp.yaml
  - cnp-vdh-test.yaml
  - cnp-vdh-backup.yaml
  - cnp-cert-manager.yaml
  - cnp-cnpg-system.yaml
  - cnp-vdh-tenant-demo-egress.yaml
  - cnp-vdh-tenant-demo-database.yaml
