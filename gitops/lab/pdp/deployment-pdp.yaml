apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdp
  namespace: vdh-pdp
  annotations: {vdh.component: "OPA", vdh.app-version: "v1.21.1"}
spec:
  replicas: 2
  selector: {matchLabels: {app: pdp}}
  template:
    metadata: {labels: {app: pdp}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: pdp}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: opa
          image: docker.io/openpolicyagent/opa:1.21.1-envoy-static@sha256:b4a8bbe87c9405419d03d1a8b6b9f4b540e7ea8ff8832248d6339b30594b344b
          # ADR-0109: the Envoy plugin serves ext_authz (gRPC, 9191) next to the REST API; decision logs on stdout
          args: ["run", "--server", "--addr=[::]:8181", "--diagnostic-addr=[::]:8282", "--disable-telemetry",
                 "--log-level=info", "--config-file=/config/opa-config.yaml",
                 "/policy/data.json", "/policy/ring.json", "/policy/decide.rego", "/policy/authz.rego",
                 "/policy/inbox.rego", "/policy/access.rego", "/policy/delegation.rego", "/policy/second_key.rego",
                 "/policy/view.rego", "/policy/tree.rego",
                 "/policy/visits.rego", "/policy/identity.rego", "/policy/fallback.rego",
                 "/policy/ceiling.rego", "/policy/edge.rego"]
          ports: [{name: http, containerPort: 8181}, {name: diag, containerPort: 8282}, {name: grpc, containerPort: 9191}]
          readinessProbe: {httpGet: {path: /health, port: 8282}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8282}, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: bundle, mountPath: /policy, readOnly: true}, {name: config, mountPath: /config, readOnly: true}]
      volumes: [{name: bundle, configMap: {name: opa-bundle}}, {name: config, configMap: {name: opa-config}}]
