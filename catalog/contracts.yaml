    conformance: "provision, inspect, reprovision and clean a lab host from git"
    exit: "host images are signed OCI artefacts; any Redfish-capable provisioner boots them"
    implementations:
      Metal3: {role: primary, readiness: partial, features: {redfish-virtual-media: yes, signed-images: partial, inspection: yes, firmware-settings: yes, cleaning-on-release: yes}, note: "CNCF; Ironic underneath"}
      Tinkerbell: {role: alternate, readiness: partial, features: {redfish-virtual-media: partial, signed-images: partial, inspection: yes, firmware-settings: partial, cleaning-on-release: partial}, note: "CNCF; workflow-based"}
