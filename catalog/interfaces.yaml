# Solution agnosticism: every capability is bound to an open interface; a component is one implementation of it.
# Consumers (front-ends, apps, agents, other components) use only the interface, never a component's private API.
# Each capability names verified open alternatives, or states its lock-in and the exit plan (EU Data Act switching).
# Lock-in: none (standard interface, drop-in alternatives) | low (standard interface, migration effort) |
#          medium (partial standard, data migration needed) | high (no standard: exit plan carries the risk).
rules:
  - "front-ends talk only to versioned APIs (OpenAPI for request/response, AsyncAPI for events) through the gateway, via a backend-for-frontend; no front-end calls a component directly"
  - "data leaves every component in an open format on request (export path tested per capability)"
  - "a component swap is a normal change: the interface tests must pass against the new implementation"

capabilities:
  orchestration:      {interface: "Kubernetes API (CNCF conformance)", implementations: [K3s], alternatives: [RKE2, Talos], lock_in: medium, exit: "redeploy the same bundles on another conformant distribution"}
  sandboxing:         {interface: "Kubernetes RuntimeClass (OCI runtime)", implementations: [gVisor, Kata Containers], alternatives: [], lock_in: low, exit: "switch the RuntimeClass"}
  ingress-and-api:    {interface: "HTTP reverse proxy generated from CALM; Kubernetes Gateway API as the target", implementations: [Envoy Gateway, Envoy, cert-manager], primary: Envoy Gateway, alternatives: [kgateway], lock_in: low, exit: "regenerate routes for another proxy from the same CALM model"}
  identity-broker:    {interface: "OIDC, SAML, SCIM, the claims contract (platform/icam.yaml)", implementations: [Keycloak], alternatives: [ZITADEL], lock_in: medium, exit: "keep the issuer URL, discovery and claims; migrate realms and keys with overlapping JWKS"}
  workload-identity:  {interface: "SPIFFE", implementations: [SPIRE], alternatives: [], lock_in: none, exit: "any SPIFFE implementation issues the same IDs"}
  secrets-and-pki:    {interface: "Vault-compatible HTTP API, ACME, PKCS#11 for HSMs", implementations: [OpenBao, step-ca], alternatives: [], lock_in: medium, exit: "step-ca can run as the RSA legacy CA; ECDSA intermediates re-issued from the offline roots; secrets exported and re-imported"}
  database:           {interface: "PostgreSQL wire protocol and SQL", implementations: [PostgreSQL, CloudNativePG, Barman Cloud plugin], primary: PostgreSQL, alternatives: [], lock_in: medium, exit: "standard dumps and replication"}
  policy-decision:    {interface: "AuthZEN Authorization API; policies as code", implementations: [OPA, evaluator], alternatives: [Cerbos], lock_in: medium, exit: "the AuthZEN request shape stays; policies are re-expressed (tests pin the semantics, tools/authz.py)"}
  reconciliation:     {interface: "OpenGitOps principles; signed OCI bundles", implementations: [Flux], alternatives: [Argo CD], lock_in: medium, exit: "point another GitOps controller at the same signed bundles"}
  workflows:          {interface: "the execution path (tools/automate.py) and CloudEvents triggers", implementations: [Argo Workflows, Argo Events], alternatives: [Tekton], lock_in: medium, exit: "runbooks are Kubernetes jobs through the execution path in every size; Argo is an optional engine and its definitions are Argo-specific; runbooks are generated from the model, so they are regenerated for another engine"}
  telemetry:          {interface: "OpenTelemetry (OTLP)", implementations: [OpenTelemetry Collector], alternatives: [], lock_in: low, exit: "any OTLP receiver"}
  metrics-and-logs:   {interface: "Prometheus remote write and PromQL; OTLP logs", implementations: [VictoriaMetrics, VictoriaLogs], alternatives: [Prometheus, Loki, ClickHouse], lock_in: low, exit: "remote write to another store; history exported"}
  dashboards:         {interface: "PromQL and LogsQL queries; dashboards as code", implementations: [Grafana], alternatives: [Perses], lock_in: medium, exit: "dashboards are generated from the model; Perses is the CNCF dashboards-as-code alternative"}
  event-backbone:     {interface: "CloudEvents and AsyncAPI over NATS subjects", implementations: [NATS], alternatives: [Apache Kafka], lock_in: medium, exit: "producers and consumers use CloudEvents; a bridge mirrors subjects during the move"}
  integration:        {interface: "Camel YAML routes, Debezium change events (CloudEvents)", implementations: [Apache Camel, Debezium, Apicurio Registry], alternatives: [], lock_in: low, exit: "routes are code; schemas in a standard registry API"}
  object-storage:     {interface: "S3 API; Apache Iceberg tables", implementations: [Garage, Trino], alternatives: [SeaweedFS], lock_in: none, exit: "copy buckets over the S3 API; Iceberg is engine-neutral"}
  data-catalog:       {interface: "OpenLineage events, Open Data Contract Standard", implementations: [OpenMetadata, Great Expectations], alternatives: [DataHub], lock_in: low, exit: "contracts and lineage live in git and as events; the catalog is a view"}
  dataspace:          {interface: "Dataspace Protocol, ODRL", implementations: [Eclipse EDC], alternatives: [], lock_in: none, exit: "any Dataspace Protocol connector"}
  vault-workspace:    {interface: "client-side end-to-end encryption; export to open formats", implementations: [CryptPad], alternatives: [Nextcloud], lock_in: medium, exit: "no standard for end-to-end encrypted collaboration: clients export their documents (open formats) and re-import; Nextcloud only with its end-to-end encryption, a weaker model"}
  chat:               {interface: "Matrix client-server and federation APIs", implementations: [Synapse, Element Web], alternatives: [Tuwunel], lock_in: none, exit: "Matrix is an open standard; clients and servers are interchangeable"}
  itsm:               {interface: "REST API; approvals as signed records in git", implementations: [GLPI], alternatives: [iTop], lock_in: medium, exit: "git inventory and decision records stay the source of truth; GLPI is a view, tickets exported as CSV/JSON"}
  dcim-ipam:          {interface: "REST and GraphQL APIs; signed export to the git estate register", implementations: [NetBox], alternatives: [Nautobot], lock_in: low, exit: "per-site data exported to git on a schedule; the schema mapping lives in inventory/schema.yaml"}
  task-queue-cache:   {interface: "the Redis protocol (RESP)", implementations: [Valkey], alternatives: [], lock_in: low, exit: "tasks and cache are rebuilt; any RESP server"}
  address-drift:      {interface: "findings as JSON and counts per rule in Prometheus text", implementations: [ipam-drift], alternatives: [], lock_in: low, exit: "the rules are data in the reconciler; NetBox's REST API is the input"}
  out-of-band-management: {interface: "DMTF Redfish (event, telemetry and update services); SPDM for component attestation", implementations: [vendor BMC firmware], alternatives: [OpenBMC], lock_in: medium, exit: "Redfish is a standard; desired firmware and BIOS settings live in git"}
  bare-metal-provisioning: {interface: "Kubernetes CRDs (BareMetalHost) driving Redfish and PXE or virtual media", implementations: [Metal3], alternatives: [Tinkerbell], lock_in: medium, exit: "host images are signed OCI artefacts; any Redfish-capable provisioner boots them"}
  forge:              {interface: "git; OCI registry API", implementations: [Forgejo], alternatives: [GitLab], lock_in: none, exit: "git and OCI are standards"}
  status:             {interface: "HTTP checks as code", implementations: [Gatus], alternatives: [], lock_in: medium, exit: "checks are generated from the model"}
  alerting:           {interface: "HTTP push, SMS, SIP", implementations: [ntfy, Gammu, Asterisk], alternatives: [], lock_in: medium, exit: "channels are adapters behind the communication plan"}
  overlay-vpn:        {interface: "WireGuard", implementations: [NetBird, WireGuard], alternatives: [Headscale], lock_in: medium, exit: "WireGuard underneath; policies regenerated"}
  network-policy:     {interface: "Kubernetes NetworkPolicy, generated from CALM", implementations: [Cilium], alternatives: [Calico], lock_in: medium, exit: "standard NetworkPolicy plus generated extensions"}
  runtime-detection:  {interface: "Sigma rules, OCSF events", implementations: [Falco, Wazuh, Suricata], alternatives: [], lock_in: low, exit: "detections are Sigma; events are OCSF"}
  attestation:        {interface: "TPM 2.0, IETF RATS, EAT", implementations: [Keylime], alternatives: [], lock_in: low, exit: "measurements are standard TPM quotes"}
  updates:            {interface: "signed A/B bundles; TUF metadata", implementations: [RAUC, hawkBit], primary: RAUC, alternatives: [], lock_in: low, exit: "systemd-sysupdate as alternative"}
  vdi:                {interface: "RDP, VNC, SSH over HTML5", implementations: [Apache Guacamole], alternatives: [], lock_in: low, exit: "desktops speak standard protocols"}
  release-gateway:    {interface: "release request, inspection results and signed manifest (platform/release-gateway.yaml)", implementations: [Apache Tika, ClamAV, YARA-X, Dangerzone, ExifTool, gitleaks], alternatives: [mat2], lock_in: none, exit: "each stage is a replaceable inspector behind the same decision function"}
  ai-egress-gate:     {interface: "OpenAI chat-completions subset between the inference gateway and the model; consent lease, egress journal and contract events (catalog/contracts.yaml, ADR-0164)", implementations: [ai-egress-gate], alternatives: [], lock_in: high, exit: "own code; another provider of the contract; clients repoint one base URL; the journal and mappings export with the tenant"}
  sealed-artefacts:   {interface: "Zero Trust Data Format", implementations: [OpenTDF], alternatives: [], lock_in: low, exit: "ZTDF is a published format"}
  inference:          {interface: "OpenAI-compatible HTTP API behind the inference gateway", implementations: [llama.cpp, vLLM, NeMo Guardrails], alternatives: [Ollama], lock_in: none, exit: "any OpenAI-compatible server"}
  model-registry:     {interface: "MLflow model format; signed OCI model artefacts", implementations: [MLflow], alternatives: [], lock_in: low, exit: "models are OCI artefacts with ML-BOMs"}
  backup:             {interface: "restic repository format; S3", implementations: [restic, rest-server, Proxmox Backup Server], alternatives: [], lock_in: low, exit: "restic format is documented; restores do not need the server"}
  preservation:       {interface: "BagIt, PDF/A, OAIS", implementations: [Archivematica], alternatives: [], lock_in: none, exit: "packages are standard BagIt"}
  host-os:            {interface: "transactional OS image; Ignition/Combustion first boot (not cloud-init); SCAP profile", implementations: [SUSE Micro], alternatives: [Flatcar, Talos], lock_in: medium, exit: "hosts are rebuilt from code; Flatcar keeps K3s, Talos replaces it"}
  host-updates:       {interface: "Kubernetes upgrade plans from git", implementations: [system-upgrade-controller, Uyuni], primary: system-upgrade-controller, alternatives: [Kured], lock_in: medium, exit: "plans are plain manifests"}
  hypervisor:         {interface: "VM images (Combustion/Ignition configuration drive, not cloud-init); OpenTofu provider", implementations: [Proxmox VE], alternatives: [], lock_in: low, exit: "VMs are rebuilt from mkosi images on another hypervisor"}
  portal:             {interface: "the estate graph (read model) and plugin views; actions only through the execution path", implementations: [Backstage], alternatives: [Grafana], lock_in: medium, exit: "the estate graph is the asset; the shell renders it and can be replaced (Grafana and the decision inbox already cover S)"}
  device-enrolment:   {interface: "enrolment session (code, short authentication string), approvals signed by WebAuthn assertions, records in the audit chain", implementations: [enrolment-service], alternatives: [], lock_in: high, exit: "own code over open standards (WebAuthn, OIDC, LUKS2, systemd-homed)"}
  privileged-access:  {interface: "SSH, HTTPS, Kubernetes, PostgreSQL and RDP through a recording bastion; OIDC sign-in; per-target credentials from OpenBao", implementations: [Warpgate], alternatives: [], lock_in: medium, exit: "targets keep standard protocols; WireGuard plus the OpenBao SSH CA remains the fallback path"}
  access-governance:  {interface: "access requests, approvals signed by passkey, leases with an end and certification as a signed change log; grants written to Keycloak by a reconciler; signed bundles for edges", implementations: [KeyClerk], alternatives: [], lock_in: high, exit: "own code over open records: grants stay Keycloak roles and groups, the rules stay Rego in the Isle's bundle, and the change log verifies without KeyClerk"}
  edge-access:        {interface: "an edge site's agent that applies the core's signed access bundle to the site's bastion and ends leases on its own clock when cut off", implementations: [ReliKey agent], alternatives: [], lock_in: high, exit: "own code over a published contract: the bundle format and its conformance set are KeyClerk's; any agent that passes it replaces ReliKey"}
  site-dns:           {interface: "DNS with DNSSEC validation; site zone as code", implementations: [Knot Resolver], alternatives: [], lock_in: none, exit: "any validating resolver serves the same zone files (PowerDNS Recursor, Unbound)"}
  authoritative-dns:  {interface: "zones as files from git, DNSSEC signing, RFC 2136 updates, catalog zones (RFC 9432)", implementations: [Knot DNS], alternatives: [], lock_in: none, exit: "zone files and standard transfers; any conformant authoritative server loads them (PowerDNS Authoritative, NSD)"}
  desktop-session-sso: {interface: "CIBA sign-in and RFC 8693 token exchange; tokens served to desktop apps from memory", implementations: [session-agent], alternatives: [], lock_in: none, exit: "own code over open standards"}
  web-application-firewall: {interface: "ModSecurity-compatible rules (OWASP Core Rule Set) in the gateway", implementations: [Coraza, OWASP CRS], primary: Coraza, alternatives: [], lock_in: medium, exit: "the rule set runs in any ModSecurity-compatible engine"}
  remote-browser:     {interface: "a disposable browser streamed as pixels over WebRTC through the VPN", implementations: [Neko, neko-rooms], primary: Neko, alternatives: [Apache Guacamole], lock_in: medium, exit: "a locked-down browser-kiosk container per session behind Guacamole (ASF governance, mature clipboard and file-transfer controls, heavier and not WebRTC)"}
  file-sharing:       {interface: "WebDAV and the Open Cloud Mesh sharing protocol; OIDC sign-in; WOPI for office editing", implementations: [OpenCloud], alternatives: [Nextcloud], lock_in: low, exit: "files are plain files behind WebDAV: copy them out over WebDAV or from the data export and re-import into another WebDAV host"}
  office-suite:       {interface: "WOPI between the file host and the editor; OpenDocument and OOXML formats; OIDC sign-in", implementations: [Nextcloud, Collabora Online], primary: Nextcloud, alternatives: [CryptPad], lock_in: low, exit: "documents are ODF or OOXML files; CryptPad imports them"}
  physical-access:    {interface: "OSDP v2 with secure channel between controller and readers at sites without a PACS; at sites with one, the lease pushed to the PACS head-end as a cardholder with activation and expiry dates", implementations: [libosdp], alternatives: [], lock_in: none, exit: "OSDP is an SIA and IEC 60839-11-5 standard: OSDP.Net (Apache-2.0) or a fork of libosdp speaks the same protocol; the badge records and the PACS contract are our own"}
  decision-inbox:     {interface: "decision cards and signed approval records (governance/approvers.yaml)", implementations: [decision-inbox], alternatives: [GLPI], lock_in: medium, exit: "the records are the interface; any front-end can render them"}
