# Provenance and supportability of every component, alternate and toolchain item: who stewards it, under which
# jurisdiction it is ultimately controlled, who can support it (and from where), and whether it is alive.
# 'signals' are measured from the forges by tools/provenance.py refresh (GitHub API, Gitea/GitLab APIs, release pages),
# last on 'checked'. 'steward', 'home', 'region' and 'support' are maintainer knowledge (point-in-time knowledge): verify before
# a client commits to a support contract. Region: eu (steward controlled from an EU member state), europe (UK, CH, NO),
# neutral (vendor-neutral foundation or community governance: protects against relicensing, not a support contract),
# non-eu (a company outside Europe controls it), own (VDHome). Policy below is enforced by tools/provenance.py.
checked: '2026-10-06'
policy:
  archived: an archived project is never used
  stale_days: 365
  stale: 'no release and no commit within stale_days: a runtime component is replaced; an alternate is no credible exit and is flagged'
  bus_factor_min_authors: 5
  bus_factor: 'fewer distinct authors than bus_factor_min_authors in the last 100 commits: accepted only with a compensating layer or self-support plan (bus_factor_accepted)'
  eu_path: 'every runtime component has an EU or European path: an EU/European steward, named EU/European support, VDHome self-support, or an alternate in the same capability that has one; what has none
    is a sovereignty gap, listed and accepted below with its mitigation, and new gaps fail the check'
  relicence_risk: a non-EU single company controlling a project is shown as concentration risk in the RTOP
eu_countries:
- AT
- BE
- BG
- CY
- CZ
- DE
- DK
- EE
- ES
- FI
- FR
- GR
- HR
- HU
- IE
- IT
- LT
- LU
- LV
- MT
- NL
- PL
- PT
- RO
- SE
- SI
- SK
europe_countries:
- UK
- CH
- 'NO'
- IS
- LI
self_supported:
  Garage: small Rust codebase; S3 API; buckets copy out over S3
  Forgejo: git and OCI are standards; Codeberg runs it at scale
  Gammu: SMS fallback channel only; ntfy and voice alerting are the other channels
  restic: documented repository format; restores do not need the server
  rest-server: small Go server; restic can also write to S3
  evaluator: own code
  decision-inbox: own code
  ipam-drift: own code (ADR-0171), standard-library Python; the rules are its data
  ai-egress-gate: own code; the AI egress gate contract is the exit
  enrolment-service: own code
bus_factor_accepted:
  cert-manager approver-policy: "three authors in the last hundred commits, inside the cert-manager project; if it stalls, the policies move to an admission check with the same rules (ADR-0172)"
  ExifTool: "single maintainer since 2003 with frequent releases; output re-checked by Tika metadata extraction and Dangerzone flattening; mat2 alternate"
  Tuwunel: "small team; since ADR-0114 Synapse (Element, UK) is the homeserver and Tuwunel only a telephony stand-in for the Harbor"
  libosdp: "one maintainer (98 of the last 100 commits); used only at sites without a PACS; the protocol is a standard, so OSDP.Net (Apache-2.0) or our own fork takes over, and the controller logic is our own (tools/piam)"
  Archivematica: "optional preservation module; BagIt packages stay readable without it"
sovereignty_gaps_accepted:   # runtime components without an EU or European path, with their containment
  vendor BMC firmware: {tier: non-eu-company, mitigation: "Redfish is a standard; firmware and BIOS settings are declared in git; the BMC network is isolated and the BMC is a protected lever (ADR-0083); OpenBMC is the open alternate where hardware allows"}
  Metal3: {tier: neutral-foundation, mitigation: "CNCF; host images are signed OCI artefacts and Redfish is a standard, so Tinkerbell or another provisioner replaces it"}
  NetBox: {tier: non-eu-company, mitigation: "site DCIM/IPAM data is exported to the git estate register on a schedule and mapped in inventory/schema.yaml, so any DCIM (Nautobot, or an EU tool) can take over; Apache-2.0 protects against relicensing of the current code (ADR-0077)"}
  Valkey: {tier: neutral-foundation, mitigation: "Linux Foundation; the Redis protocol is the interface, and NetBox's tasks and cache are rebuilt, so any RESP server replaces it"}
  Envoy: {tier: neutral-foundation, mitigation: "CNCF (Envoy project); the same proxy as under Envoy Gateway; kgateway and Istio also run Envoy, and the gateway routes regenerate from CALM"}
  Envoy Gateway: {tier: neutral-foundation, mitigation: "CNCF (Envoy project); the alternate kgateway is also CNCF; Traefik (FR origin) was the EU exit but is on hold for its advisory record (ADR-0073); routes regenerate from CALM for any conformant implementation"}
  cert-manager: {tier: neutral-foundation, mitigation: "CNCF; ACME is a standard, OpenBao's ACME endpoint is the in-house issuer"}
  Apache Camel: {tier: neutral-foundation, mitigation: "Apache; routes are code"}
  Apache Guacamole: {tier: neutral-foundation, mitigation: "Apache; desktops speak RDP, VNC, SSH"}
  Apache Tika: {tier: neutral-foundation, mitigation: "Apache; one inspector among several in the release gateway"}
  Argo Events: {tier: neutral-foundation, mitigation: "optional; CloudEvents triggers are engine-neutral"}
  Argo Workflows: {tier: neutral-foundation, mitigation: "optional engine; runbooks are regenerated for Tekton"}
  Cilium: {tier: neutral-foundation, mitigation: "CNCF graduated; standard NetworkPolicy fallback (Calico) keeps the exit; EU partner to be named"}
  Barman Cloud plugin: {tier: neutral-foundation, mitigation: "CNCF (CloudNativePG); backups are plain barman-cloud objects in S3, restorable with barman-cloud alone or the in-tree recovery"}
  CloudNativePG: {tier: neutral-foundation, mitigation: "PostgreSQL itself has EU support (Dalibo FR, CYBERTEC AT, credativ DE); the operator is thin"}
  Coraza: {tier: neutral-foundation, mitigation: "OWASP; the Core Rule Set is portable to ModSecurity-compatible engines (CRS support: netnea, CH)"}
  Dangerzone: {tier: neutral-foundation, mitigation: "non-profit; conversion to flat PDF can be rebuilt from its open container"}
  Debezium: {tier: neutral-foundation, mitigation: "Commonhaus; change events are CloudEvents"}
  Falco: {tier: neutral-foundation, mitigation: "Sigma detections and OCSF events; Suricata and Wazuh overlap"}
  Kata Containers: {tier: neutral-foundation, mitigation: "RuntimeClass switch to gVisor or plain runc with stricter isolation per label"}
  Keylime: {tier: neutral-foundation, mitigation: "TPM quotes are standard; attestation is one signal among several"}
  llama.cpp: {tier: neutral-foundation, mitigation: "community; OpenAI-compatible API; vLLM and Ollama are exits"}
  MLflow: {tier: neutral-foundation, mitigation: "models are OCI artefacts with ML-BOMs"}
  NATS: {tier: neutral-foundation, mitigation: "CNCF after the 2025 dispute; CloudEvents bridge to Kafka is the exit; watch the steward"}
  OpenBao: {tier: neutral-foundation, mitigation: "Linux Foundation fork; Vault-compatible API; secrets exportable; the KEK is tenant-held (PKI-01)"}
  OpenTelemetry Collector: {tier: neutral-foundation, mitigation: "OTLP is the interface; any receiver replaces it"}
  SPIRE: {tier: neutral-foundation, mitigation: "SPIFFE IDs are the interface"}
  Trino: {tier: neutral-foundation, mitigation: "Iceberg tables are engine-neutral"}
  vLLM: {tier: neutral-foundation, mitigation: "OpenAI-compatible API; llama.cpp covers S and M"}
  WireGuard: {tier: neutral-foundation, mitigation: "Linux kernel mainline; supported through the host distribution"}
  Apicurio Registry: {tier: non-eu-company, mitigation: "standard registry API; schemas live in git"}
  Warpgate: {tier: non-eu-company, mitigation: "maintainer-led, home not yet established; standard protocols to every target and the WireGuard plus OpenBao SSH CA path stay as the fallback"}
  Archivematica: {tier: non-eu-company, mitigation: "optional module; packages are BagIt"}
  Asterisk: {tier: non-eu-company, mitigation: "optional voice alerting; SIP is the standard"}
  ClamAV: {tier: non-eu-company, mitigation: "one inspector among several; signatures are open"}
  ExifTool: {tier: non-eu-company, mitigation: "one layer of several: Dangerzone flattens, Tika re-checks metadata; mat2 (FR) is the alternate"}
  Gatus: {tier: non-eu-company, mitigation: "checks are generated from the model; any HTTP checker replaces it"}
  gitleaks: {tier: non-eu-company, mitigation: "one inspector among several; rules are regexes, portable"}
  Grafana: {tier: non-eu-company, mitigation: "dashboards are generated from the model; Perses (CNCF) is the exit; AGPL keeps the code open"}
  Great Expectations: {tier: non-eu-company, mitigation: "steward change (Fivetran): checks are code; Soda Core or SQL tests are exits"}
  gVisor: {tier: non-eu-company, mitigation: "RuntimeClass switch to Kata"}
  NeMo Guardrails: {tier: non-eu-company, mitigation: "optional guard layer behind the inference gateway; replaceable by policy in the gateway"}
  ntfy: {tier: non-eu-company, mitigation: "one channel among several (SMS, voice, Matrix); single maintainer"}
  OpenMetadata: {tier: non-eu-company, mitigation: "contracts and lineage live in git and as OpenLineage events; DataHub is the exit"}
  OpenTDF: {tier: non-eu-company, mitigation: "ZTDF is a published format; the key access service decision converges on the focal point"}
  step-ca: {tier: non-eu-company, mitigation: "deviation-only (RSA legacy CA)"}
  VictoriaLogs: {tier: non-eu-company, mitigation: "OTLP logs in; export to another store"}
  VictoriaMetrics: {tier: non-eu-company, mitigation: "Prometheus remote write and PromQL: Prometheus is a drop-in exit"}
  Wazuh: {tier: non-eu-company, mitigation: "Sigma and OCSF; Falco and Suricata cover detection if Wazuh changes course"}
  YARA-X: {tier: non-eu-company, mitigation: "rules are plain YARA syntax, portable across engines"}
