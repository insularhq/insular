# Advisory posture per component over the 24 months before 2026-10-08: reviewed GitHub advisories by package plus
# advisories the project published itself (re-measure before decisions). Counts measure disclosure as
# much as quality: a mature project discloses more, and 'vendor channel only' means GitHub sees nothing (PostgreSQL,
# Proxmox, GitLab and Garage publish through their own channels). Exposure comes from platform/seams.yaml zones.
# tools/contracts.py ranks attack-surface priority = exposure x posture and checks compensations.
measured: '2026-10-08'
window_months: 24
weights: {critical: 10, high: 3, medium: 1, low: 0}
compensations_required_when: {priority_at_least: 30}   # needs WAF or gateway isolation, a pinned version and the patch SLA
