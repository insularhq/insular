  - {id: BUNDLE-STALENESS, owner: security_officer, status: active, review_by: "2027-04-08", topic: bundle-staleness, effect: limit, by_band: {amber: "12h", red: "4h", black: "0"}, by_trust: {high: "24h", medium: "12h", low: "4h", none: "0"}, scope: {}, valid_from: "2026-10-10", mitigates: [RI-03], anchor: signature, residual: {L: 2, I: 2}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten]}
  - {id: DRIFT-RESOLUTION, owner: security_officer, status: active, review_by: "2027-04-08", topic: drift-resolution, effect: limit, parameter: "an open difference between a master and observed state is resolved or accepted within 24 hours", scope: {}, valid_from: "2026-10-10", mitigates: [RI-04], anchor: configuration, residual: {L: 2, I: 2}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten]}
  - {id: CUSTODY-CLEARANCE, owner: security_officer, status: active, review_by: "2027-04-08", topic: custody-clearance, effect: forbid, parameter: "placing data on a facility whose clearance or custody is to-establish or below the data's label", scope: {}, valid_from: "2026-10-10", mitigates: [RI-05], anchor: human-approval, residual: {L: 2, I: 3}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten]}
  - {id: PATCH-SLA, owner: security_officer, status: active, review_by: "2027-04-08", topic: patch-sla, effect: limit, parameter: "critical 72h, high 7d, medium 30d from upstream fix to deployed; past it the component's trust drops one band and exposure is reduced or compensated", scope: {}, valid_from: "2026-10-10", mitigates: [RI-06], anchor: configuration, residual: {L: 2, I: 3}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten]}
