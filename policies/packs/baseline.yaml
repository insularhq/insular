  - {id: HOST-BASELINE, owner: security_officer, status: active, review_by: "2027-04-08", topic: host-baseline, effect: require, parameter: "default-drop inbound in both families, key-only SSH and SELinux enforcing before the host joins; drift is an incident", scope: {}, valid_from: "2026-10-10", mitigates: [RI-02], anchor: configuration, residual: {L: 1, I: 3}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten]}
