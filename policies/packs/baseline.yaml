  - {id: FED-EXCHANGE-DEPTH, owner: security_officer, status: active, review_by: "2027-04-08", topic: federation-exchange-depth, effect: limit, parameter: "two token-exchange hops, pairwise subjects per receiving broker, every exchange logged", scope: {}, valid_from: "2026-10-10", mitigates: [RI-08], anchor: signature, residual: {L: 1, I: 4}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten]}
  - {id: FED-CHAIN-EXPIRY, owner: security_officer, status: active, review_by: "2027-04-08", topic: federation-chain-expiry, effect: limit, by_trust: {high: "24h", medium: "72h", low: "7d", none: "0"}, scope: {}, valid_from: "2026-10-10", mitigates: [RI-09], anchor: signature, residual: {L: 2, I: 2}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten]}
  - {id: FED-PARTNER-EVIDENCE, owner: security_officer, status: active, review_by: "2027-04-14", topic: federation-partner-evidence, effect: limit, parameter: "a partner's band is earned by fresh evidence (policies/federation.yaml partner_trust); trust above it only by a decided risk acceptance of at most 90 days and at most medium, with its limits", scope: {}, valid_from: "2026-10-14", decision: {by: owner, date: "2026-10-14", record: ADR-0149}, mitigates: [RI-26], anchor: signature, residual: {L: 2, I: 4}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten, test_federation_partners_earn_trust_by_evidence_and_acceptance_is_limited]}
  - {id: SITE-AUTONOMY, owner: security_officer, status: active, review_by: "2027-04-08", topic: site-autonomy, effect: require, parameter: "every site sized to run alone for 72 hours: issuers keep issuing, queues hold 72 hours, certificates outlive the budget; isolation time is a signal", scope: {}, valid_from: "2026-10-10", mitigates: [RI-10], anchor: configuration, residual: {L: 1, I: 3}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten]}
