  - {id: TEMP-ISLE-LEASE, owner: security_officer, status: active, review_by: "2027-04-08", topic: temporary-isle-lease, effect: limit, parameter: "the temporary Isle lease lasts at most 15 minutes, renewed by heartbeat; it ends when any Isle is reachable; a site served by a temporary Isle runs at band amber or higher", by_band: {amber: "15m", red: "5m", black: "0"}, scope: {}, valid_from: "2026-10-10", mitigates: [RI-20], anchor: signature, residual: {L: 1, I: 3}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten, test_a_temporary_isle_never_creates_trust_and_is_bound_to_risk_and_policy]}
  - {id: SKIFF-ROAMING, owner: security_officer, status: active, review_by: "2027-04-08", topic: skiff-roaming, effect: limit, parameter: "a Skiff whose Islet is unreachable may reach another Isle or Islet of its own ring through any relay, keeping its own lease and getting no new grant; never a site outside its ring; a roaming Skiff runs at band amber or higher and its session is at most 1 hour", by_band: {amber: "1h", red: "15m", black: "0"}, scope: {}, valid_from: "2026-10-10", mitigates: [RI-21], anchor: configuration, residual: {L: 1, I: 3}, tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten, test_skiffs_reach_the_overlay_through_any_relay_of_their_ring_under_their_own_lease]}
  - {id: BREAK-GLASS-UPGRADE-GATE, owner: security_officer, status: active, review_by: "2027-04-10", topic: break-glass-upgrade, effect: require, parameter: "no standing break-glass token is kept; an OpenBao upgrade proceeds only after the root-on-demand drill (regenerate a root from unseal shares through the loopback-only listener, use it, revoke it) passes on the new version in a test", scope: {}, valid_from: "2026-10-11", mitigates: [RI-22], anchor: configuration, residual: {L: 1, I: 4}, tests: [test_every_policy_rule_decides_as_written, test_break_glass_keeps_a_loopback_only_generate_root_listener_and_its_risk_is_gated]}
  - {id: BACKUP-BENEATH-CORE, owner: security_officer, status: active, review_by: "2027-04-13", topic: backup-beneath-core, effect: require, parameter: "every master backed up where platform/resilience.yaml says, with a copy outside the failure domain it protects; backup keys on the break-glass tokens, never only in OpenBao; a release proceeds only when the core restore drill (platform/resops.yaml core_restore_order, without Keycloak, OpenBao, NetBird or the policy point running) passed within 90 days (ADR-0139)", scope: {}, valid_from: "2026-10-13", mitigates: [RI-23, RI-24], anchor: configuration, residual: {L: 1, I: 5}, tests: [test_every_policy_rule_decides_as_written, test_resops_is_core_risk_and_backup_sits_beneath_the_core]}
