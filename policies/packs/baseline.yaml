id: baseline
kind: baseline
title: "Platform baseline policy"
rules:
  - id: MACSEC-INTER-SITE
    title: "MACsec on every inter-site link, WireGuard kept inside it"
    tests: [test_every_policy_rule_decides_as_written, test_opa_and_the_python_engine_decide_identically_and_bands_only_tighten, test_a_ciso_decision_flows_into_rule_rollout_impact_and_risk]
    owner: security_officer
    status: active
    review_by: "2027-06-30"
    topic: inter-site-link-encryption
    effect: require
    parameter: "IEEE 802.1AE MACsec with MKA, GCM-AES-XPN-256"
    scope: {}
    valid_from: "2027-04-02"
    decision: {by: security_officer, date: "2026-10-14", record: ADR-0146}
