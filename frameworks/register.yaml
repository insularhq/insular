# Framework register: which public rules the platform claims, how compliance is proven, and what it costs to obtain
# the text. One spine (anchor + id authority + legal bridge), the rest mapped onto it. Non-public texts (most
# STANAGs/ADatPs) are excluded until publicly available.
spine:
  certifiable_anchor: iso-27001
  control_id_authority: nist-800-53
  belgian_legal_bridge: cyfun-2025
  sovereignty_positioning: eu-cloud-sovereignty-framework

frameworks:
  # management systems (certifiable)
  iso-27001:   {title: "ISO/IEC 27001:2022 ISMS (+ 27002 controls)", text: paid, proof: "certification by a BELAC-accredited body"}
  iso-27017:   {title: "ISO/IEC 27017 cloud security controls", text: paid, proof: "extension to 27001 audit"}
  iso-27018:   {title: "ISO/IEC 27018 PII in public cloud (processor)", text: paid, proof: "extension to 27001 audit"}
  iso-27701:   {title: "ISO/IEC 27701 privacy information management", text: paid, proof: "certification"}
  iso-22301:   {title: "ISO 22301 business continuity", text: paid, proof: "certification (later)"}
  iso-42001:   {title: "ISO/IEC 42001 AI management system (AI pipelines)", text: paid, proof: "certification (later)"}
  iso-20000:   {title: "ISO/IEC 20000-1 service management", text: paid, proof: "optional; FitSM is the working method"}
  fitsm:       {title: "FitSM lightweight IT service management (EU-funded)", text: public, proof: "self-assessment"}
  # control catalogues and methods (public)
  nist-800-53: {url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final", title: "NIST SP 800-53 rev5 controls (OSCAL native)", text: public, proof: "OSCAL SSP + assessment results"}
  nist-csf-2:  {url: "https://csrc.nist.gov/pubs/cswp/29/the-nist-cybersecurity-framework-csf-20/final", title: "NIST Cybersecurity Framework 2.0", text: public, proof: "profile mapping"}
  nist-800-37: {url: "https://csrc.nist.gov/pubs/sp/800/37/r2/final", title: "NIST SP 800-37 RMF, ongoing authorisation", text: public, proof: "continuous OSCAL assessment"}
  nist-800-137: {url: "https://csrc.nist.gov/pubs/sp/800/137/final", title: "NIST SP 800-137 continuous monitoring", text: public, proof: "assurance plane"}
  nist-800-207: {url: "https://csrc.nist.gov/pubs/sp/800/207/final", title: "NIST SP 800-207 zero trust architecture", text: public, proof: "architecture mapping"}
  cisa-ztmm-2: {url: "https://www.cisa.gov/zero-trust-maturity-model", title: "CISA Zero Trust Maturity Model v2", text: public, proof: "maturity self-assessment per pillar"}
  mape-k:      {title: "MAPE-K autonomic control loop", text: public, proof: "design mapping"}
  nist-800-190: {title: "NIST SP 800-190 container security", text: public, proof: "isolation.yaml mapping"}
  nist-800-218: {title: "NIST SSDF SP 800-218 secure development", text: public, proof: "CI evidence"}
  slsa:        {url: "https://slsa.dev/spec/v1.0/levels", title: "SLSA supply-chain levels (OpenSSF)", text: public, proof: "provenance attestations"}
  nist-800-61: {url: "https://csrc.nist.gov/pubs/sp/800/61/r3/final", title: "NIST SP 800-61r3 incident response", text: public, proof: "incident.yaml + game days"}
  ebios-rm:    {url: "https://cyber.gouv.fr/la-methode-ebios-risk-manager", title: "EBIOS Risk Manager (ANSSI)", text: public, proof: "risk register method"}
  cis-benchmarks: {title: "CIS Benchmarks (Linux, Kubernetes)", text: public, proof: "automated scans"}
  bsi-c5:      {title: "BSI C5 cloud criteria", text: public, proof: "mapping (attestation only via German auditors)"}
  # Belgian and EU law and schemes
  cyfun-2025:  {url: "https://atwork.safeonweb.be/tools-resources/cyberfundamentals-framework", title: "CyberFundamentals 2025 (CCB, Belgium)", text: public, proof: "self-assessment; verification or certification by an accredited CAB for NIS2 presumption of conformity"}
  gdpr:        {title: "GDPR (EU 2016/679)", text: public, proof: "DPA, records of processing, DPIA support, breach clocks"}
  nis2:        {title: "NIS2 (EU 2022/2555) and Belgian NIS2 law", text: public, proof: "via CyFun or ISO 27001; reporting clocks"}
  be-criminal-code-book2: {url: "https://www.ejustice.just.fgov.be/eli/wet/2024/02/29/2024002088/justel", title: "Belgian Criminal Code Book II (law of 29 February 2024), art. 524-528 computer crime", text: public, proof: "consent and authorised scope documented per engagement"}
  cra:         {title: "Cyber Resilience Act (EU 2024/2847)", text: public, proof: "technical file if a product is placed on the market; route needs counsel"}
  dora:        {title: "DORA (EU 2022/2554)", text: public, proof: "only for financial-sector clients: ICT third-party register entries"}
  ai-act:      {title: "AI Act (EU 2024/1689, as amended 2026/1744)", text: public, proof: "use classification; the AI egress gate keeps AI on pseudonymised data"}
  data-act:    {title: "Data Act (EU 2023/2854) cloud switching", text: public, proof: "exit plan, export formats, no lock-in"}
  eu-cloud-sovereignty-framework: {title: "EU Cloud Sovereignty Framework v1.2.1 (SOV-1..8, SEAL-0..4)", text: public, proof: "self-assessment per objective for tenders"}
  eucc:        {url: "https://eur-lex.europa.eu/eli/reg_impl/2024/482/oj", title: "EUCC Common Criteria scheme (EU 2024/482), ISO/IEC 15408 / EAL", text: public, proof: "not pursued for the platform (cost); reuse public protection profiles as design input"}
  eucs:        {title: "EUCS cloud scheme (ENISA)", text: public, proof: "watch: adoption status to verify"}
  secnumcloud: {title: "SecNumCloud (ANSSI)", text: public, proof: "provider choice only, not a claim of the platform itself"}
  # assurance reporting and exchange formats
  isae-3000:   {title: "ISAE 3000 assurance report (IAASB)", text: paid, proof: "independent auditor report, e.g. on operator blindness"}
  oscal:       {url: "https://pages.nist.gov/OSCAL/", title: "OSCAL (NIST) machine-readable compliance", text: public, proof: "all artefacts"}
  csaf-2:      {title: "CSAF 2.0 security advisories (OASIS)", text: public, proof: "advisories and VEX"}
  tlp-2:       {url: "https://www.first.org/tlp/", title: "FIRST Traffic Light Protocol 2.0", text: public, proof: "labels on incident communication"}
  rfc-9116:    {title: "security.txt (RFC 9116)", text: public, proof: "published on vdhome.be"}
  # NATO: only public material; ADatP-4774 and 4778 are authorised for public disclosure (ACP 240 found not public)
  nist-ir-8496: {title: "NIST IR 8496 Data Classification Concepts and Considerations for Improving Data Protection (initial public draft)", text: public, proof: "data classes, labels and rules mapped in policies/packs/data-centric.yaml"}
  nist-sp-1800-28: {title: "NIST SP 1800-28 Data Confidentiality: Identifying and Protecting Assets Against Data Breaches", text: public, proof: "practice guide mapping (DLP, encryption, access control)"}
  nist-sp-1800-29: {title: "NIST SP 1800-29 Data Confidentiality: Detect, Respond to, and Recover from Data Breaches", text: public, proof: "practice guide mapping (detection, response)"}
  nist-800-88: {title: "NIST SP 800-88 Guidelines for Media Sanitization (cryptographic erase)", text: public, proof: "shred ledger and key destruction records"}
  ietf-scitt: {url: "https://www.rfc-editor.org/rfc/rfc9943", title: "IETF SCITT, RFC 9943 An Architecture for Trustworthy and Transparent Digital Supply Chains", text: public, proof: "transparency log and signed statements (tools/provenance_log.py)"}
  oasis-data-provenance: {title: "Data Provenance Standards (Data and Trust Alliance, continued in the OASIS Data Provenance Standard TC)", text: public, proof: "envelope fields mapped to the standard's metadata"}
  w3c-prov: {title: "W3C PROV-DM and PROV-O provenance model", text: public, proof: "envelope export as PROV"}
  w3c-odrl: {url: "https://www.w3.org/TR/odrl-model/", title: "W3C ODRL Information Model 2.2 (usage policies)", text: public, proof: "leases expressed as ODRL agreements in dataspace contracts"}
  c2pa: {title: "C2PA content credentials (capture and ingredient assertions)", text: public, proof: "capture assertions on physical surrogates"}
  enisa-pseudonymisation: {title: "ENISA Pseudonymisation techniques and best practices (2019) and related reports", text: public, proof: "keyed fingerprints, per-case pseudonyms, minimum group sizes"}
  rfc-2634: {title: "RFC 2634 Enhanced Security Services for S/MIME (ESSSecurityLabel)", text: public, proof: "ESS labels encoded and decoded by tools/security_labels.py, anchored on the RFC 7444 and XEP-0258 examples"}
  rfc-7444: {url: "https://www.rfc-editor.org/rfc/rfc7444", title: "RFC 7444 Security Labels in Internet Email (SIO-Label, SIO-Label-History)", text: public, proof: "the mail gate writes SIO-Label headers (tools/security_labels.py sio_label)"}
  xep-0258: {title: "XEP-0258 Security Labels in XMPP", text: public, proof: "securitylabel elements rendered from the canonical label"}
  xmlspif: {title: "Open XML SPIF 3.0 (xmlspif.org), Security Policy Information File", text: public, proof: "the VDHOME SPIF validates against the published schema (a recorded schema validation)"}
  adatp-4774: {url: "https://nso.nato.int/nso/", title: "ADatP-4774 (STANAG 4774) Confidentiality Metadata Label Syntax, Edition A Version 1", text: public, proof: "authorized for public disclosure, not for reproduction; labels rendered in its namespace and structure; obtain the official edition from the NATO Standardization Office before claiming conformance"}
  adatp-4778: {url: "https://nso.nato.int/nso/", title: "ADatP-4778 (STANAG 4778) Metadata Binding Mechanism, Edition A Version 1", text: public, proof: "authorized for public disclosure, not for reproduction; binding container rendered structurally; attribute details to verify against the official edition before claiming conformance"}
  nato-public: {title: "NATO public standards (when publicly available)", text: public, proof: "mapping when obtained officially"}

