  - {name: Envoy Gateway, licence: Apache-2.0, plane: access, role: consolidated API gateway cells (Kubernetes Gateway API) from M}
  - {name: k3d, licence: MIT, plane: assurance, role: disposable K3s clusters for tests (CI and developers)}
  - {name: Chainsaw, licence: Apache-2.0, plane: assurance, role: declarative end-to-end tests per capability interface (CI)}
  - {name: Chaos Mesh, licence: Apache-2.0, plane: assurance, role: chaos and DDIL tests (CI, CNCF)}
  - {name: OWASP ZAP, licence: Apache-2.0, plane: assurance, role: dynamic security testing of the gateway (CI)}
  - {name: Schemathesis, licence: MIT, plane: assurance, role: API contract tests from OpenAPI (CI)}
  - {name: cert-manager, licence: Apache-2.0, plane: foundation, role: ACME certificates for the gateway (CNCF)}
  - {name: CloudNativePG, licence: Apache-2.0, plane: foundation, role: "PostgreSQL operator with replicas, backups and point-in-time recovery"}
  - {name: Barman Cloud plugin, licence: Apache-2.0, plane: foundation, role: "CloudNativePG backup plugin: WAL and base backups to the object store"}
  - {name: Backstage, licence: Apache-2.0, plane: governance, role: single pane of glass front door over the estate graph (CNCF)}
  - {name: YARA-X, licence: BSD-3-Clause, plane: workspace, role: rule matching in the release gateway (successor of YARA)}
  - {name: ExifTool, licence: GPL-1.0-or-later, plane: workspace, role: metadata removal in the release gateway (replaces mat2)}
  - {name: SUSE Micro, licence: GPL-2.0, plane: foundation, role: host OS (openSUSE Leap Micro or SUSE Linux Micro; mixed open licences, kernel GPL-2.0)}
  - {name: system-upgrade-controller, licence: Apache-2.0, plane: foundation, role: OS and K3s upgrades as plans from git}
  - {name: Uyuni, licence: GPL-2.0, plane: governance, role: optional host fleet management}
  - {name: enrolment-service, licence: own, plane: access, role: boot-stick enrolment sessions and officer approvals}
  - {name: Warpgate, licence: Apache-2.0, plane: access, role: privileged-access bastion with session recording and approvals}
  - {name: KeyClerk, licence: EUPL-1.2, plane: access, role: access requests, approvals, leases and certification for Keycloak; signed bundles for edges (ADR-0176, ADR-0182)}
  - {name: ReliKey agent, licence: EUPL-1.2, plane: access, role: an edge site's lease enforcement on its bastion, from KeyClerk's signed bundle, working cut off (ADR-0182)}
  - {name: Coraza, licence: Apache-2.0, plane: access, role: web application firewall in the gateway (Wasm)}
  - {name: OWASP CRS, licence: Apache-2.0, plane: access, role: rule set for the web application firewall}
  - {name: hawkBit, licence: EPL-2.0, plane: workspace, role: staged rollout server for boot-stick images (Eclipse Foundation)}
  - {name: Knot DNS, licence: GPL-3.0-or-later, plane: foundation, role: "the Isle's authoritative signer: zones from git, DNSSEC under KASP, catalog zones (CZ.NIC, ADR-0155, ADR-0172)"}
  - {name: Knot Resolver, licence: GPL-3.0-or-later, plane: foundation, role: "the validating site resolver, a part of Knot DNS in the core (CZ.NIC, ADR-0172 amendment)"}
  - {name: session-agent, licence: own, plane: workspace, role: sign-in and tokens inside VDI desktops}
  - {name: neko-rooms, licence: Apache-2.0, plane: workspace, role: one disposable Neko container per session}
  - {name: Neko, licence: Apache-2.0, plane: workspace, role: disposable remote browser streamed as pixels}
  - {name: Nextcloud, licence: AGPL-3.0, plane: workspace, role: files and office host for Internal teams (optional), agpl: true}
  - {name: Collabora Online, licence: MPL-2.0, plane: workspace, role: office editing over WOPI for Internal teams (optional)}
  - {name: OpenCloud, licence: Apache-2.0, plane: workspace, role: "file sharing: personal drives and project spaces for a tenant"}
  - {name: decision-inbox, licence: own, plane: governance, role: plain-language decision cards for risk owners}
  - {name: room-sender, licence: own, plane: observability, role: the ring's firing alerts into its Matrix alert room, ids and links only}

# Allowed licence families (OSI-approved or open rule licences). Anything else fails the check.
allowed_licences: [LGPL-3.0, PostgreSQL, Apache-2.0, MIT, BSD-3-Clause, BSD-2-Clause, MPL-2.0, LGPL-2.1, GPL-2.0, GPL-3.0, GPL-1.0, AGPL-3.0, EPL-2.0, DRL-1.1, EUPL-1.2, own]

paid:   # cost classes, to verify per purchase; no software licences
  cloud: "an EU cloud provider (and/or a second one): servers, volumes, object storage, traffic"
  domains_dns: "domain registrations"
  hardware: "Nitrokey HSM 2 (x2, root custody), FIDO2 keys (two per user), USB sticks for the boot route, optional managed devices for Restricted"
  people: "operator time; second key custodian; independent witness at key ceremonies"
  assurance: "external assurance and legal advice as the deployer chooses"
  optional_support: "paid support from EU partners only when the deployer asks for it"
