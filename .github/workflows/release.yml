# A tag v* becomes a release: the source archive at that commit, its CycloneDX SBOM of the Python tools, SHA-256 sums, a
# build provenance attestation, and notes from CHANGELOG.md. Verify: sha256sum -c SHA256SUMS, then
# gh attestation verify FILE --repo insularhq/insular
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q --require-hashes -r requirements-ci.txt
      - run: python -m pip install -q --no-deps --require-hashes -r requirements-keyclerk.txt   # the engine's release wheel, by hash
      - run: mkdir -p "$HOME/.local/bin" && python tools/fetch_opa.py --dest "$HOME/.local/bin/opa" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python ci/check_public.py
  build:
    # everything that installs packages runs here, without write permissions
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q --require-hashes -r requirements-ci.txt
      - name: Build the archive, its SBOM, its sums and the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="insular-$TAG/" -o "dist/insular-$TAG.tar.gz" "$TAG"
          python -m cyclonedx_py requirements requirements-ci.txt -o "dist/insular-$TAG.cdx.json"
          (cd dist && sha256sum "insular-$TAG.tar.gz" "insular-$TAG.cdx.json" > SHA256SUMS)
          python ci/release_notes.py "$TAG" > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error
          retention-days: 7
  release:
    # holds the write tokens: no checkout of code to run, no package installs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/insular-*.tar.gz
            dist/insular-*.cdx.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --notes-file notes.md dist/insular-*.tar.gz dist/insular-*.cdx.json dist/SHA256SUMS
