# Insular's public CI: lint, then the model's checks and tests, which must all pass.
# Actions are pinned by commit SHA; Python tools are hash-locked; the engine is its release wheel, by hash.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q --require-hashes -r requirements-ci.txt
      - run: python -m ruff check --select E9,F63,F7,F82 tools tests
  check:
    name: Model checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q --require-hashes -r requirements-ci.txt
      - run: python -m pip install -q --no-deps --require-hashes -r requirements-keyclerk.txt   # the engine's release wheel, by hash
      - run: mkdir -p "$HOME/.local/bin" && python tools/fetch_opa.py --dest "$HOME/.local/bin/opa" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python ci/check_public.py
