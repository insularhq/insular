leases:   # ADR-0095: every use of a product is a lease its owner granted (policies/data-leases.yaml); the PDP checks it
  - {id: DL-0001, kind: subscription, product: hr-roster, consumer: scheduling-app, purpose: scheduling, scope: "columns person_ref, shift, site; rows of the consumer's own site", granted_by: hr-service-owner, grant: new, onward: forbidden, obligation: none, status: active, from: "2026-10-01", until: "2027-03-30"}
  - {id: DL-0002, kind: subscription, product: sensor-telemetry, consumer: analytics-lakehouse, purpose: analytics, scope: "all columns; all sites", granted_by: site-ops-owner, grant: new, onward: forbidden, obligation: none, status: active, from: "2026-10-01", until: "2027-09-30"}
  - {id: DL-0003, kind: subscription, product: sensor-telemetry, consumer: partner-dataspace, purpose: operations, scope: "aggregates per site per hour; the EDC contract carries the same end date as an ODRL dateTime constraint", aggregated: true, min_group_size: 10, granted_by: site-ops-owner, grant: new, onward: forbidden, obligation: none, status: active, from: "2026-10-01", until: "2027-03-30"}
  - {id: DL-0004, kind: subscription, product: platform-health, consumer: spog-pane, purpose: operations, scope: "health per site and component", granted_by: observability-owner, obligation: none, grant: new, onward: forbidden, status: active, from: "2026-10-01", until: "2027-09-30"}
  - {id: DL-0005, kind: subscription, product: security-events, consumer: soc-console, purpose: security-monitoring, scope: "all events of the tenant", granted_by: security-officer-role, obligation: safety, grant: new, onward: forbidden, status: active, from: "2026-10-01", until: "2027-03-30"}
  - {id: DL-0006, kind: subscription, product: audit-log, consumer: audit-viewer, purpose: audit, scope: "the audit chain, read-only", granted_by: security-officer-role, obligation: legal, grant: new, onward: forbidden, status: active, from: "2026-10-01", until: "2027-03-30"}
  - {id: DL-0007, kind: subscription, product: policy-bundles, consumer: site-pdps, purpose: enforcement, scope: "the signed bundle for each site", granted_by: policy-owner, obligation: safety, grant: new, onward: forbidden, status: active, from: "2026-10-01", until: "2027-03-30"}
  - {id: DL-0008, kind: subscription, product: case-files-index, consumer: case-officers, purpose: case-handling, scope: "the cases assigned to the officer", granted_by: case-owner, obligation: legal, grant: new, onward: forbidden, status: active, from: "2026-10-01", until: "2026-12-29"}

# Data mesh (Zhamak Dehghani's four principles) mapped onto the platform:
#   domain ownership              -> each product has a domain and a data owner (a person, not IT)
#   data as a product             -> contract, discoverable (catalog), addressable (subject, table, dataspace asset),
#                                    trustworthy (quality checks), secure (label and policy), self-describing (schema)
#   self-serve data platform      -> a data product INTENT compiles into everything below (tools/dataproducts.py)
#   federated computational governance -> global policy as code; domains may only tighten it (floor check)
mesh:
  domains:
    people:     {owner: people-domain-lead, products: [hr-roster]}
    operations: {owner: operations-domain-lead, products: [sensor-telemetry]}
    cases:      {owner: cases-domain-lead, products: [case-files-index]}
    platform:   {owner: platform-domain-lead, products: [infra-inventory, change-records, platform-telemetry, platform-health, security-events, audit-log, policy-bundles, policy-decisions]}
    analysis:   {owner: analysis-domain-lead, products: [analyst-chat, physical-references]}
  global_policy:   # every product, every domain
    labels: [Internal, Sensitive, Restricted]
    max_retention_days: {Internal: 1825, Sensitive: 3650, Restricted: 3650}
    personal_data_masking_from: Sensitive
    required: [owner, label, schema, purposes, quality_suite, lineage, retention_days, review_months]
  domain_overlays:   # tighten only
    people: {max_retention_days: {Sensitive: 730}, extra_rules: ["no export outside the EU"]}
