# Seams: every place where two components meet. For each: the open standard, how each side proves who it is, the
# enforcement point, who watches it (never one of the two parties: a seam is watched from outside), what breaks and in
# which mode when it fails, and how well the two integrate (native: built in; plugin: maintained extension; glue: code
# VDHome owns; manual: a person). Checked by tools/resilience.py.
#
# Watchers: hubble (Cilium flow observer in the kernel datapath, sees both identities, independent of both ends),
# evaluator (synthetic transactions across the seam plus telemetry checks), off-instance-evaluator (watches the
# instance from outside, including the on-instance evaluator), ztop (enforcement points' live state), audit (signed
# audit chain), pgaudit (database statements). Who watches the watchers: the on- and off-instance evaluators watch each
# other through the dead-man heartbeat; the off-instance one alerts the operator's phone on independent channels.

seams:
  # --- S ----------------------------------------------------------------------------------------------------------
  - {id: S01, class: web-access, from: person, to: Envoy Gateway, standard: "TLS 1.3, HTTP", authn: "OIDC session (passkey), device signals from M", pep: Envoy Gateway, watch: [evaluator, ztop, off-instance-evaluator], on_failure: fail-closed, integration: native, size: S, ports: ["443/tcp"], zones: [vpn-overlay, gateway-cell], l6: "TLS 1.3"}
