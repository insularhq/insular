# Component dependencies for bootstrap, upgrade and decommission order. 'host' is the provisioned machine.
# Bootstrap and upgrades follow dependency order (dependencies first, canary instance first); decommission runs in
# reverse and ends with crypto-erasure (destroying the keys makes remaining data unreadable) after evidence export.
needs:
  K3s: [host]
  gVisor: [host]
  WireGuard: [host]
  Cilium: [K3s]
  system-upgrade-controller: [K3s]
  SUSE Micro: []
  Uyuni: [K3s]
  PostgreSQL: [K3s, CloudNativePG]
  OpenBao: [K3s]
  cert-manager: [K3s]
  CloudNativePG: [K3s]
  Keycloak: [PostgreSQL, OpenBao, Envoy Gateway]
  keycloak-config-cli: [Keycloak]
  cert-manager approver-policy: [cert-manager]
  CryptPad: [Envoy Gateway, Keycloak]
  Flux: [K3s]
  OpenTelemetry Collector: [K3s]
  VictoriaMetrics: [K3s]
  VictoriaLogs: [K3s]
  Grafana: [Keycloak, VictoriaMetrics, VictoriaLogs]
  restic: [K3s, OpenBao]
  decision-inbox: [Keycloak]
  Coraza: [Envoy Gateway]
  OWASP CRS: [Coraza]
  hawkBit: [K3s, PostgreSQL]
  Knot DNS: [K3s]
  Knot Resolver: [Knot DNS]
  session-agent: [Keycloak]
  Neko: [K3s]
  Nextcloud: [K3s, PostgreSQL, Keycloak]
