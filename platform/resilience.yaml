# Backing services that some components require but the bill of materials does not declare. Each must become a
# declared component (BOM, lock, provenance, profile) or the component must be configured onto a declared one.
undeclared_backing:
  MariaDB: "GLPI and Archivematica support only MySQL or MariaDB, not PostgreSQL (verify per version)"
  OpenSearch: "OpenMetadata needs a search engine (OpenSearch or Elasticsearch)"
  Iceberg REST catalog: "Trino with Iceberg needs a catalog service (candidates: Lakekeeper, Apache Polaris, Nessie)"
  Wazuh indexer: "Wazuh ships its own OpenSearch fork as indexer; a second search cluster beside OpenSearch"
